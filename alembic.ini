# Alembic configuration for the aqueduct-analysis-microservice.
#
# The database URL is NOT configured here — migrations/env.py reads it from
# the POSTGRES_URL environment variable (same variable the app uses).
#
# Usage (inside the dev container, which has POSTGRES_URL set):
#   alembic upgrade head
#   alembic current
#   alembic history

[alembic]
script_location = migrations

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
